<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animais PWA</title>
  <meta name="description" content="App de animais com API, PWA e geolocalização">
  <meta name="theme-color" content="#153996">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>Animais</h1>
    <p>Busque imagens de gatos e cachorros</p>
  </header>

  <main class="container">
    <section class="box">
      <input type="text" id="input" placeholder="Digite: dog ou cat">

      <div class="botoes">
        <button onclick="buscarAnimal()">Buscar</button>
        <button onclick="carregarAleatorio()">Aleatório</button>
        <button onclick="pegarLocalizacao()">Minha localização</button>
      </div>

      <button id="btnInstalar" hidden>Instalar App</button>

      <div id="status"></div>
    </section>

    <section id="container"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
